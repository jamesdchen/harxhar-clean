model: bucket_enet

bucket: all_buckets
cache_root: results/covid_imp_rank   # cluster path; override to the _aggregated harvest locally
horizon: 1
output_file: results/bucket_enet/run.csv
end: -1

train_window: 24000   # W
alpha: 0.001          # incumbent enet penalty
l1_ratio: 0.2         # incumbent dense L1 mix
refit: 480
standardize: true
n_jobs: null          # null/1 -> serial; >1 -> chunk-parallel (one process per refit block)
