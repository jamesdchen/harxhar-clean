model: rg_lru_reservoir

bucket: all_buckets
cache_root: results/covid_imp_rank   # cluster path; override to the _aggregated harvest locally
horizon: 1
output_file: results/rg_lru_reservoir/run.csv
end: -1

# frozen RG-LRU feature bank
d_model: 256          # reservoir width per layer
n_layers: 2
input_scale: 1.0      # frozen input-projection gain (tune, no SGD)
reservoir_seed: 0

# rank-1 rolling-ridge readout
train_window: 24000   # W
alpha: 1.0
refit: 480
fit_intercept: true
n_jobs: null          # null/1 -> serial; >1 -> chunk-parallel readout (scratch-memmap workers)
